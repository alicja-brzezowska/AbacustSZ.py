[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abacustsz"
version = "0.1.0"
description = "Thermal SZ (Compton-y) maps painted onto AbacusSummit light-cone halos"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Alicja Brzezowska" }]
dependencies = [
    "abacusutils>=2.1.2",
    "asdf>=5.1.0",
    "astropy>=7.1.1",
    "colossus>=1.3.17",
    "h5py>=3.15.1",
    "healpy>=1.19.0",
    "jax>=0.8.0",
    "loguru>=0.5.3",
    "matplotlib>=3.10.7",
    "numba>=0.63.1",
    "numpy",
    "psutil>=7.2.2",
    "quadax>=0.2.11",
    "scipy",
    "unxt>=1.7.7",
    "wcosmo>=0.5.4",
    "wrapt>=2.1.1",
]

[project.optional-dependencies]
forward-model = [
    "pyyaml",
    "submitit",
]
inference = [
    "corner>=2.2.3",
    "dynesty>=3.0.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["abacustsz"]
