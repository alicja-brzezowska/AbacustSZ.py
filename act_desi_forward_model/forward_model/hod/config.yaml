sim_params:
    sim_name: 'lightcone_halos'
    sim_dir: '/path/to/backlight_cp999'           # same as ABACUS_DATA_PATH
    output_dir: '/path/to/output/hod_mocks'
    subsample_dir: '/path/to/output/hod_subsamples'
    z_mock: 0.503                                 # overridden by --z / --alt_z
    halo_lc: True
    cleaned_halos: False

prepare_sim:
    Nparallel_load: 1
    Nthread_per_load: 8

HOD_params:
    want_ranks: True
    want_AB: False
    tracer_flags:
        LRG: True
        ELG: False
        QSO: False
    want_rsd: True
    write_to_disk: True

    # DR9 LRG small-scale CMB-lensing HOD fit, native CompaSO masses [Msun/h], one set for
    # all snapshots. The mocks are then thinned by halo with thin_hosts.py to a mean
    # host mass log10(<M200m>/[Msun/h]) = 13.25.
    LRG_params:
        logM_cut: 12.6611
        logM1: 13.7850
        sigma: 0.0270
        alpha: 1.0668
        kappa: 0.9211
        alpha_c: 0
        alpha_s: 1
        s: 0
        s_v: 0
        s_p: 0
        s_r: 0
        Acent: -7.31189630e-01
        Asat: -2.41898268e-01
        Bcent: -9.37221616e-03
        Bsat: 3.74532572e-02
        ic: 0.97
